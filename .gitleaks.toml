title = "Little Hero Labs repository secret scanning"
[extend]
useDefault = true

[[rules]]
id = 'supabase-server-secret'
description = 'Supabase modern privileged server secret, including unlabelled values'
regex = '''\b(sb_secret_[A-Za-z0-9_-]{20,})\b'''
secretGroup = 1
keywords = ['sb_secret_']

[[allowlists]]
description = "Explicit redaction and documentation environment placeholders, never real values"
regexTarget = "secret"
regexes = [
  '^REDACTED_[A-Z0-9_]+$',
  '^YOUR_[A-Z0-9_]+$',
  '^your-(?:backend|cron|api|access|refresh)-(?:token|secret|key)$',
  '^YOUR-[A-Z-]+$',
]

[[allowlists]]
description = "Two intentionally invalid scanner fixtures; scoped by both path and exact value"
condition = "AND"
paths = ['(?:^|/)back-end/scripts/test-workflow-export-secrets\.ts$']
regexTarget = "secret"
regexes = ['^abcdef123456$', '^eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.abc\.def$']

[[allowlists]]
description = "Documented filename in an explanatory comment, not an API key"
condition = "AND"
paths = ['(?:^|/)back-end/src/app/api/orders/\[orderId\]/replace-image/route\.ts$']
regexTarget = "secret"
regexes = ['^pose03_r2\.png$']

[[allowlists]]
description = "Public outreach profile label, not LinkedIn application credentials"
condition = "AND"
paths = ['(?:^|/)outreach-data/lhl/pipeline\.md$']
regexTarget = "match"
regexes = ['^LinkedIn: [a-zA-Z0-9_.-]+;$']

[[allowlists]]
description = "Reviewed non-secret object-key/idempotency expression"
condition = "AND"
