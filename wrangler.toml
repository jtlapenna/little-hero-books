# Cloudflare Pages configuration for little-hero-labs-admin
# This is read when root directory is empty in Cloudflare Pages settings
name = "little-hero-labs-admin"
pages_build_output_dir = "back-end/.open-next/cloudflare"
compatibility_date = "2024-11-01"
compatibility_flags = [
  "nodejs_compat",
  "enable_nodejs_process_v2",
  "enable_nodejs_http_modules",
  "nodejs_compat_populate_process_env"
]

