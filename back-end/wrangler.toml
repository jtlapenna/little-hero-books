name = "little-hero-labs-admin"
pages_build_output_dir = ".open-next/cloudflare"
compatibility_date = "2024-11-01"
compatibility_flags = [
  "nodejs_compat",
  "enable_nodejs_process_v2",
  "enable_nodejs_http_modules",
  "nodejs_compat_populate_process_env"
]

[vars]
# Enable only after production SMTP, code template and approved users are verified.
ADMIN_SUPABASE_AUTH_ENABLED = "false"
GELATO_DRAFT_SUBMISSION_ENABLED = "false"
GELATO_CANCEL_ENABLED = "false"
GELATO_STATUS_RELAY_ENABLED = "false"
GELATO_STATUS_POLLING_ENABLED = "false"
GELATO_SCHEDULED_STATUS_ENABLED = "false"
GELATO_NOTIFICATIONS_ENABLED = "false"

# Exact one-copy operator test. Deployment copies validated production settings.
GELATO_WORKFLOW_TEST_SUBMISSION_ENABLED = "false"
GELATO_WORKFLOW_TEST_SUBMISSION_ORDER_ID = ""
GELATO_WORKFLOW_TEST_SUBMISSION_ACCOUNT_SHA256 = ""
GELATO_WORKFLOW_TEST_SUBMISSION_EXPIRES_AT = ""
GELATO_ORDINARY_RELEASE_ENABLED = "false"
GELATO_ORDINARY_RELEASE_ACCOUNT_SHA256 = ""
GELATO_ORDINARY_RELEASE_APPROVERS = ""
GELATO_ORDINARY_RELEASE_TEST_ORDER_ID = ""
GELATO_ORDINARY_RELEASE_TEST_EXPIRES_AT = ""

# Runtime-only identity metadata. Actual values come from the reviewed Access app
# and exact production Pages settings, after build and before upload.
CF_ACCESS_ISSUER = ""
CF_ACCESS_AUDIENCE = ""
ADMIN_SITE_ORIGIN = ""
ADMIN_ALLOWED_EMAILS = ""
