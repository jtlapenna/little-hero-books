name = "little-hero-labs-admin"
pages_build_output_dir = ".open-next/cloudflare"
compatibility_date = "2024-11-01"
compatibility_flags = [
  "nodejs_compat",
  "enable_nodejs_process_v2",
  "enable_nodejs_http_modules",
  "nodejs_compat_populate_process_env"
]

[vars]
GELATO_DRAFT_SUBMISSION_ENABLED = "false"
GELATO_CANCEL_ENABLED = "false"
GELATO_STATUS_RELAY_ENABLED = "false"
GELATO_STATUS_POLLING_ENABLED = "false"
GELATO_NOTIFICATIONS_ENABLED = "false"
