name: Check local Gelato launch and readiness preparation
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  local-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: back-end/package-lock.json
      - name: Install locked dependencies
        working-directory: back-end
        run: npm ci
      - name: Verify independent launcher processes against synthetic loopback only
        working-directory: back-end
        run: env -i HOME="$HOME" PATH="$PATH" node --import tsx scripts/test-gelato-protected-launch.ts
      - name: Verify offline shipping matrix and non-authorizing package
        working-directory: back-end
        run: env -i HOME="$HOME" PATH="$PATH" node --import tsx scripts/test-gelato-local-window.ts
      - name: Verify unexpected fulfillment safeguards using synthetic services
        working-directory: back-end
        run: env -i HOME="$HOME" PATH="$PATH" node --import tsx scripts/test-gelato-incident-safeguards.ts
      - name: Verify retained historical probe checks without service access
        run: env -i HOME="$HOME" PATH="$PATH" node docs/repo-workflows-planning/gelato-draft-approval-evidence-2026-10-22/test-probes.mjs
      - name: Verify scope credential dispatch and runtime key proof locally
        working-directory: back-end
        run: |
          env -i HOME="$HOME" PATH="$PATH" node --import tsx scripts/test-gelato-credential-auth.ts
          env -i HOME="$HOME" PATH="$PATH" node --import tsx scripts/test-gelato-runtime-key-proof.ts
          env -i HOME="$HOME" PATH="$PATH" node --import tsx scripts/test-gelato-protected-runner.ts
      - name: Verify corrected inert no-order probe candidates
        run: env -i HOME="$HOME" PATH="$PATH" node docs/repo-workflows-planning/gelato-auth-attestation-evidence-2026-10-22/test-probes.mjs
      - name: Verify retained evidence and current source bindings
        run: |
          python3 docs/repo-workflows-planning/gelato-local-launch-evidence-2026-10-21/verify.py
          python3 docs/repo-workflows-planning/gelato-incident-safeguards-evidence-2026-10-21/verify.py
          python3 docs/repo-workflows-planning/gelato-draft-approval-evidence-2026-10-22/verify.py
          python3 docs/repo-workflows-planning/gelato-auth-attestation-evidence-2026-10-22/verify.py
          python3 docs/repo-workflows-planning/controlled-pipeline-source-evidence-2026-10-22/verify.py
          python3 docs/repo-workflows-planning/controlled-character-handoff-evidence-2026-10-22/verify.py
          python3 docs/repo-workflows-planning/lhl-diagnostic-access-evidence-2026-10-23/verify.py
          python3 docs/security/book-layout-source-evidence-2026-10-30/verify.py --source
          python3 docs/security/book-layout-source-evidence-2026-10-30/test-verifier.py
