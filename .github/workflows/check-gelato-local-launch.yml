name: Check local Gelato launch and readiness preparation
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  local-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: back-end/package-lock.json
      - name: Install locked dependencies
        working-directory: back-end
        run: npm ci
      - name: Verify independent launcher processes against synthetic loopback only
        working-directory: back-end
        run: env -i HOME="$HOME" PATH="$PATH" node --import tsx scripts/test-gelato-protected-launch.ts
      - name: Verify offline shipping matrix and non-authorizing package
        working-directory: back-end
        run: env -i HOME="$HOME" PATH="$PATH" node --import tsx scripts/test-gelato-local-window.ts
      - name: Verify local evidence and source bindings
        run: python3 docs/repo-workflows-planning/gelato-local-launch-evidence-2026-10-21/verify.py --source
