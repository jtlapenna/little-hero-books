name: Application Production Build
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      SUPABASE_URL: https://build-db.example.test
      NEXT_PUBLIC_SUPABASE_URL: https://build-db.example.test
      SUPABASE_SERVICE_ROLE_KEY: synthetic-build-server-key
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-build-public-key
      BACKEND_API_TOKEN: synthetic-build-machine-authority
      STRIPE_SECRET_KEY: sk_test_synthetic_build_key
      STRIPE_WEBHOOK_SECRET: synthetic-build-stripe-hook
      CLOUDFLARE_ACCOUNT_ID: synthetic-build
      R2_ACCESS_KEY_ID: synthetic-build-access
      R2_SECRET_ACCESS_KEY: synthetic-build-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: back-end/package-lock.json
      - run: npm ci
        working-directory: back-end
      - name: Package and verify isolated scheduler functions without live jobs
        run: |
          node --experimental-strip-types lhl-scheduler/build.ts
          node --experimental-strip-types lhl-scheduler/test.ts
          node back-end/node_modules/typescript/bin/tsc -p lhl-scheduler/tsconfig.json
      - name: Verify bounded public request bodies and signed Stripe payloads
        run: node --import tsx scripts/test-request-body.ts
        working-directory: back-end
      - name: Verify request/cache and customization archive boundaries
        run: |
          node --import tsx scripts/test-csv-request-boundary.ts
          node --import tsx scripts/test-preview-error-boundary.ts
          node --import tsx scripts/test-preview-cache-boundary.ts
          node --import tsx scripts/test-customization-zip.ts
          node --import tsx scripts/test-customization-zip-consumers.ts
        working-directory: back-end
      - name: Verify checkout validation before provider or storage access
        run: node --import tsx scripts/test-checkout-validation.ts
        working-directory: back-end
      - name: Check asynchronous route parameters
        working-directory: back-end
        run: node --import tsx scripts/test-trigger-w0-route.ts
      - name: Verify authenticated read-only W0 route diagnostic
        working-directory: back-end
        run: node --import tsx scripts/test-w0-route-check.ts
      - name: Verify frozen order selection and generation handoff
        working-directory: back-end
        run: |
          node --import tsx scripts/test-w0-deployed-selection.ts
          node --import tsx scripts/test-w0-character-handoff.ts
          node --import tsx scripts/test-w1-frozen-manifest-handoff.ts
          node --import tsx scripts/test-w2a-base-input.ts
          node --import tsx scripts/test-w2a-pose-input.ts
          node --import tsx scripts/test-w2a-frozen-generation-input.ts
          node --import tsx scripts/test-publish-book-config-immutability.ts
          node --import tsx scripts/test-book-config-semantics.ts
          node --import tsx scripts/test-frozen-book-handoff.ts
      - name: Verify shared v3 layout and calibration contracts
        working-directory: back-end
        run: |
          node --import tsx scripts/test-book-layout-v3.ts
          node --import tsx scripts/test-book-layout-calibration-v3.ts
          node --import tsx scripts/test-book-layout-calibration-http.ts
      - name: Verify PDFMonkey server credential boundary
        run: npm run test:w4-print-worker
        working-directory: back-end
      - name: Build actual Next, OpenNext and Pages package (no font fixture)
        run: npm run pages:build
        working-directory: back-end
      - name: Exercise actual compiled Pages Worker without provider access
        working-directory: back-end
        run: node --import tsx scripts/test-compiled-pages-worker.ts
      - name: Verify native upload-input fixtures and actual built package with synthetic context
        working-directory: back-end
        run: node --import tsx scripts/test-pages-upload-identity.ts --built-package
      - run: node scripts/security/test-hosted-release-checks.mjs
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_SITE_URL: https://www.littleherolabs.com
      PUBLIC_API_URL: https://admin.littleherolabs.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Verify frontend deployment smoke checks on loopback fixtures
        run: npm run test:deployment-smoke
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
