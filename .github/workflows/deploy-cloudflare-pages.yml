name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'back-end/**'
      - '.github/workflows/deploy-cloudflare-pages.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd back-end
          npm ci
          echo "✅ Dependencies installed"
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "Checking opennextjs-cloudflare installation:"
          npx opennextjs-cloudflare --version || echo "⚠️ opennextjs-cloudflare not found in npx"

      - name: Build
        run: |
          cd back-end
          echo "🔨 Starting build..."
          echo "Current directory: $(pwd)"
          echo "Checking for open-next.config.js:"
          ls -la open-next.config.js || echo "⚠️ open-next.config.js not found"
          echo "Running pages:build..."
          npm run pages:build 2>&1 | tee build.log || {
            echo "❌ Build failed!"
            echo "Build log:"
            cat build.log || true
            echo "Checking for partial build output:"
            ls -la .open-next/ 2>/dev/null || echo "  .open-next directory not found"
            exit 1
          }
        env:
          NODE_ENV: production

      - name: Verify build output exists
        run: |
          cd back-end
          if [ ! -d ".open-next/cloudflare" ]; then
            echo "❌ ERROR: Build output directory .open-next/cloudflare does not exist!"
            echo "Build directory contents:"
            ls -la .open-next/ 2>/dev/null || echo "  .open-next directory not found"
            exit 1
          fi
          echo "✅ Build output directory exists"
          echo "Build output contents:"
          ls -la .open-next/cloudflare | head -20

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: back-end
          command: pages deploy .open-next/cloudflare --project-name=little-hero-labs-admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

