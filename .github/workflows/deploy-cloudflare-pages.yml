name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'back-end/**'
      - '.github/workflows/deploy-cloudflare-pages.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd back-end
          npm ci
          echo "✅ Dependencies installed"
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "Checking opennextjs-cloudflare installation:"
          npx opennextjs-cloudflare --version || echo "⚠️ opennextjs-cloudflare not found in npx"

      - name: Build
        run: |
          cd back-end
          echo "🔨 Starting build..."
          echo "Current directory: $(pwd)"
          echo "Checking for open-next.config.js:"
          ls -la open-next.config.js || echo "⚠️ open-next.config.js not found"
          echo "Running pages:build..."
          npm run pages:build 2>&1 | tee build.log || {
            echo "❌ Build failed!"
            echo "Build log:"
            cat build.log || true
            echo "Checking for partial build output:"
            ls -la .open-next/ 2>/dev/null || echo "  .open-next directory not found"
            exit 1
          }
        env:
          NODE_ENV: production

      - name: Verify build output exists
        run: |
          cd back-end
          if [ ! -d ".open-next/cloudflare" ]; then
            echo "❌ ERROR: Build output directory .open-next/cloudflare does not exist!"
            echo "Build directory contents:"
            ls -la .open-next/ 2>/dev/null || echo "  .open-next directory not found"
            exit 1
          fi
          echo "✅ Build output directory exists"
          echo "Build output contents:"
          ls -la .open-next/cloudflare | head -20

      - name: Pre-deploy diagnostics
        run: |
          cd back-end
          echo "=== PRE-DEPLOY DIAGNOSTICS ==="
          echo "Current directory: $(pwd)"
          echo "Build output exists: $([ -d ".open-next/cloudflare" ] && echo "YES" || echo "NO")"
          echo "Build output size: $(du -sh .open-next/cloudflare 2>/dev/null || echo "N/A")"
          echo "Build output file count: $(find .open-next/cloudflare -type f 2>/dev/null | wc -l || echo "0")"
          echo "Wrangler available: $(which wrangler || echo "NOT FOUND")"
          echo "Wrangler version: $(wrangler --version 2>/dev/null || echo "NOT AVAILABLE")"
          echo "NPM wrangler version: $(npm list wrangler 2>/dev/null | grep wrangler || echo "NOT FOUND")"
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "NPX version: $(npx --version)"
          echo "Environment variables check:"
          echo "  CLOUDFLARE_API_TOKEN: $([ -n "$CLOUDFLARE_API_TOKEN" ] && echo "SET (${#CLOUDFLARE_API_TOKEN} chars)" || echo "NOT SET")"
          echo "  CLOUDFLARE_ACCOUNT_ID: $([ -n "$CLOUDFLARE_ACCOUNT_ID" ] && echo "SET" || echo "NOT SET")"
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "❌ ERROR: Required environment variables are not set!"
            exit 1
          fi
          echo "=============================="

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: back-end
          command: pages deploy .open-next/cloudflare --project-name=little-hero-labs-admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEBUG: "1"

      - name: Post-deploy diagnostics
        if: always()
        run: |
          cd back-end
          echo "=== POST-DEPLOY DIAGNOSTICS ==="
          echo "Deploy step outcome: ${{ steps.deploy.outcome }}"
          echo "Deploy step conclusion: ${{ steps.deploy.conclusion }}"
          echo "Checking if deployment actually happened..."
          echo "Current time: $(date)"
          echo "=============================="

