name: Deploy to Cloudflare Pages
# Authoritative production backend deploy for admin.littleherolabs.com

on:
  push:
    branches: [main]
    paths:
      - 'back-end/**'
      - '.github/workflows/deploy-cloudflare-pages.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_ENVIRONMENT: production
      CLOUDFLARE_PAGES_PROJECT: little-hero-labs-admin
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd back-end
          npm ci
          echo "✅ Dependencies installed"
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "Checking opennextjs-cloudflare installation:"
          npx opennextjs-cloudflare --version || echo "⚠️ opennextjs-cloudflare not found in npx"

      - name: Build
        run: |
          cd back-end
          # Purpose: ensure the step fails if `npm run pages:build` fails (even when piped to `tee`)
          set -o pipefail
          echo "🔨 Starting build..."
          echo "Current directory: $(pwd)"
          echo "Checking for open-next.config.js:"
          ls -la open-next.config.js || echo "⚠️ open-next.config.js not found"
          echo "Running pages:build..."
          npm run pages:build 2>&1 | tee build.log || {
            echo "❌ Build failed!"
            echo "Build log:"
            cat build.log || true
            echo "Checking for partial build output:"
            ls -la .open-next/ 2>/dev/null || echo "  .open-next directory not found"
            exit 1
          }
        env:
          NODE_ENV: production

      - name: Verify build output exists
        run: |
          cd back-end
          if [ ! -d ".open-next/cloudflare" ]; then
            echo "❌ ERROR: Build output directory .open-next/cloudflare does not exist!"
            echo "Build directory contents:"
            ls -la .open-next/ 2>/dev/null || echo "  .open-next directory not found"
            exit 1
          fi
          echo "✅ Build output directory exists"
          echo "Build output contents:"
          ls -la .open-next/cloudflare | head -20

      - name: Pre-deploy diagnostics
        run: |
          cd back-end
          set -euo pipefail
          echo "=== PRE-DEPLOY DIAGNOSTICS ==="
          echo "Deploy environment: $DEPLOY_ENVIRONMENT"
          echo "Target project: $CLOUDFLARE_PAGES_PROJECT"
          echo "Current directory: $(pwd)"
          echo "Build output exists: $([ -d ".open-next/cloudflare" ] && echo "YES" || echo "NO")"
          echo "Build output size: $(du -sh .open-next/cloudflare 2>/dev/null || echo "N/A")"
          echo "Build output file count: $(find .open-next/cloudflare -type f 2>/dev/null | wc -l || echo "0")"
          echo "Wrangler available: $(which wrangler || echo "NOT FOUND")"
          echo "Wrangler version: $(wrangler --version 2>/dev/null || echo "NOT AVAILABLE")"
          echo "NPM wrangler version: $(npm list wrangler 2>/dev/null | grep wrangler || echo "NOT FOUND")"
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "NPX version: $(npx --version)"
          echo "Environment variables check:"
          echo "  CLOUDFLARE_API_TOKEN: $([ -n "$CLOUDFLARE_API_TOKEN" ] && echo "SET (${#CLOUDFLARE_API_TOKEN} chars)" || echo "NOT SET")"
          echo "  CLOUDFLARE_ACCOUNT_ID: $([ -n "$CLOUDFLARE_ACCOUNT_ID" ] && echo "SET" || echo "NOT SET")"
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "  CLOUDFLARE_ACCOUNT_ID preview: ${CLOUDFLARE_ACCOUNT_ID:0:6}...${CLOUDFLARE_ACCOUNT_ID: -4}"
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "❌ ERROR: Required environment variables are not set!"
            exit 1
          fi
          echo "=============================="

      - name: Fail-fast account/project wiring checks
        run: |
          set -euo pipefail
          WRANGLER_PROJECT_NAME=$(node -e "const fs=require('fs');const txt=fs.readFileSync('back-end/wrangler.toml','utf8');const match=txt.match(/^name\\s*=\\s*\"([^\"]+)\"/m);if(!match){console.error('Missing name in back-end/wrangler.toml');process.exit(1);}process.stdout.write(match[1]);")
          echo "wrangler.toml project: $WRANGLER_PROJECT_NAME"
          echo "workflow project: $CLOUDFLARE_PAGES_PROJECT"
          if [ "$WRANGLER_PROJECT_NAME" != "$CLOUDFLARE_PAGES_PROJECT" ]; then
            echo "❌ ERROR: wrangler.toml project name does not match workflow target project."
            exit 1
          fi
          echo "Checking whether project exists in provided Cloudflare account..."
          PROJECT_LIST_JSON=$(npx wrangler pages project list --json)
          node -e "const projects=JSON.parse(process.argv[1]);const name=process.env.CLOUDFLARE_PAGES_PROJECT;const found=Array.isArray(projects)&&projects.some((p)=>p&&p.name===name);if(!found){console.error('❌ ERROR: target project not found in this Cloudflare account.');process.exit(1);}console.log('✅ Project found in target account:',name);" "$PROJECT_LIST_JSON"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ env.CLOUDFLARE_PAGES_PROJECT }}

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: back-end
          command: pages deploy .open-next/cloudflare --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEBUG: "1"

      - name: Smoke-check canonical admin backend
        run: |
          cd back-end
          npm run smoke:admin-backend
        env:
          ADMIN_BASE_URL: https://admin.littleherolabs.com
          CUSTOMER_SITE_URL: ${{ secrets.CUSTOMER_SITE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Post-deploy diagnostics
        if: always()
        run: |
          cd back-end
          echo "=== POST-DEPLOY DIAGNOSTICS ==="
          echo "Deploy step outcome: ${{ steps.deploy.outcome }}"
          echo "Deploy step conclusion: ${{ steps.deploy.conclusion }}"
          echo "Checking if deployment actually happened..."
          echo "Current time: $(date)"
          echo "=============================="
