name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'back-end/**'
      - '.github/workflows/deploy-cloudflare-pages.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd back-end
          npm ci

      - name: Build
        run: |
          cd back-end
          npm run pages:build
        env:
          NODE_ENV: production

      - name: Verify build output exists
        run: |
          cd back-end
          if [ ! -d ".open-next/cloudflare" ]; then
            echo "❌ ERROR: Build output directory .open-next/cloudflare does not exist!"
            echo "Build directory contents:"
            ls -la .open-next/ 2>/dev/null || echo "  .open-next directory not found"
            exit 1
          fi
          echo "✅ Build output directory exists"
          echo "Build output contents:"
          ls -la .open-next/cloudflare | head -20

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: back-end
          command: pages deploy .open-next/cloudflare --project-name=little-hero-labs-admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

