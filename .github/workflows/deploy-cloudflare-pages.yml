name: Deploy to Cloudflare Pages
# Production uploads are explicit while schema and native workflow credentials are coordinated.
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact reviewed main commit after coordinated rollout prerequisites
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: lhl-production-release
  cancel-in-progress: false
jobs:
  # A reusable workflow runs from this exact caller commit. Production cannot
  # deploy until BOTH scan/runtime and migrated database/notification jobs pass.
  safety:
    uses: ./.github/workflows/check-workflow-export-secrets.yml
    permissions:
      contents: read
  deploy:
    needs: safety
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_ENVIRONMENT: production
      CLOUDFLARE_PAGES_PROJECT: little-hero-labs-admin
      REVIEWED_SOURCE_SHA: ${{ inputs.reviewed_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: back-end/package-lock.json
      - name: Require reviewed main commit and successful hosted checks
        run: node scripts/security/require-hosted-release-checks.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci
        working-directory: back-end
      - run: npm run pages:build
        working-directory: back-end
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Prepare exact project runtime bindings
        working-directory: back-end
        run: node scripts/prepare-gelato-runtime-bindings.mjs
      - name: Recheck hosted gates immediately before upload
        run: node scripts/security/require-hosted-release-checks.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Deploy verified package with locked Wrangler
        id: deploy_package
        working-directory: back-end
        run: |
          set -euo pipefail
          node scripts/prepare-gelato-runtime-bindings.mjs --verify
          node --import tsx scripts/create-pages-upload-identity.ts
          echo "identity_recorded=true" >> "$GITHUB_OUTPUT"
          node node_modules/wrangler/bin/wrangler.js pages deploy .open-next/cloudflare --project-name=little-hero-labs-admin --branch=main
      - name: Verify anonymous privileged access is rejected
        run: |
          set -euo pipefail
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://admin.littleherolabs.com/api/orders)" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://admin.littleherolabs.com/api/admin/session)" = 401
      - name: Retain sanitized pre-dispatch input observation, including after upload failure
        if: ${{ always() && steps.deploy_package.outputs.identity_recorded == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, official pin verified
        with:
          name: lhl-pages-upload-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lhl-pages-upload-input.json
          if-no-files-found: error
          retention-days: 7
          overwrite: false
          include-hidden-files: false
