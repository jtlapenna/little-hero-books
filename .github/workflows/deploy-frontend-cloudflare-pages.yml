name: Deploy Frontend to Cloudflare Pages
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact reviewed main commit after coordinated rollout prerequisites
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: lhl-production-release
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: little-hero-labs
      PUBLIC_SITE_URL: https://www.littleherolabs.com
      PUBLIC_API_URL: https://admin.littleherolabs.com
      REVIEWED_SOURCE_SHA: ${{ inputs.reviewed_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Require reviewed main commit and successful hosted checks
        run: node scripts/security/require-hosted-release-checks.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Verify output and target
        working-directory: frontend
        run: |
          set -euo pipefail
          test -d dist
          test -f dist/_headers
          test -f dist/robots.txt
          test -f dist/llms.txt
          node -e 'const fs=require("fs");if(!/^name = "little-hero-labs"$/m.test(fs.readFileSync("wrangler.toml","utf8")))process.exit(1)'
      - name: Install backend-locked deployment tool
        working-directory: back-end
        run: npm ci
      - name: Recheck hosted gates immediately before upload
        run: node scripts/security/require-hosted-release-checks.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Deploy frontend with locked Wrangler
        working-directory: frontend
        run: node ../back-end/node_modules/wrangler/bin/wrangler.js pages deploy dist --project-name=little-hero-labs --branch=main
      - name: Smoke-check customer site
        run: |
          set -euo pipefail
          curl -fsS -o "$RUNNER_TEMP/lhl-frontend-home.html" https://www.littleherolabs.com/
          grep -q 'Little Hero Labs' "$RUNNER_TEMP/lhl-frontend-home.html"
          curl -fsS -o "$RUNNER_TEMP/lhl-frontend-sitemap.xml" https://www.littleherolabs.com/sitemap.xml
          grep -q 'personalized-birthday-book' "$RUNNER_TEMP/lhl-frontend-sitemap.xml"
          curl -fsSI -o "$RUNNER_TEMP/lhl-frontend-home.headers" https://www.littleherolabs.com/
          grep -qi '^strict-transport-security:' "$RUNNER_TEMP/lhl-frontend-home.headers"
