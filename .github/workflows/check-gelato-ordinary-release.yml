name: Check isolated Gelato ordinary release core and persistent store
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  local-release-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: back-end/package-lock.json
      - name: Install locked dependencies
        working-directory: back-end
        run: npm ci
      - name: Verify synthetic release guards without global service access
        working-directory: back-end
        run: env -i HOME="$HOME" PATH="$PATH" node --import tsx scripts/test-gelato-ordinary-release.ts
      - name: Load the reviewed disposable PostgreSQL 17 image
        run: |
          docker pull postgres:17@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
          docker tag postgres:17@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317 postgres:17
          docker run --rm --pull=never --network=none postgres:17 postgres --version
      - name: Verify durable ownership and recovery in disposable PostgreSQL
        working-directory: back-end
        run: env -i HOME="$HOME" PATH="$PATH" LHL_TEST_POSTGRES_DOCKER_IMAGE=postgres:17 node --import tsx scripts/test-gelato-ordinary-release-store.ts
      - name: Verify exact-cohort queue and polling with normal controls OFF
        working-directory: back-end
        run: env -i HOME="$HOME" PATH="$PATH" LHL_TEST_POSTGRES_DOCKER_IMAGE=postgres:17 node --import tsx scripts/test-gelato-isolation.ts
      - name: Verify persistent local SQL session framing and isolation
        working-directory: back-end
        run: env -i HOME="$HOME" PATH="$PATH" LHL_TEST_POSTGRES_DOCKER_IMAGE=postgres:17 node --import tsx scripts/test-local-preview-sessions.ts
      - name: Verify durable admission revocation and independently confirmed setup cleanup
        working-directory: back-end
        run: env -i HOME="$HOME" PATH="$PATH" LHL_TEST_POSTGRES_DOCKER_IMAGE=postgres:17 npm run test:gelato-admission-settlement
      - name: Generate visible dummy book rasters using locked Sharp
        working-directory: back-end
        run: env -i HOME="$HOME" PATH="$PATH" node --import tsx scripts/create-gelato-local-rasters.ts "$RUNNER_TEMP/gelato-combined-rasters" "ci-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Verify assembled books through persistent release, scheduler and admin
        working-directory: back-end
        run: |
          env -i HOME="$HOME" PATH="$PATH" \
            LHL_TEST_POSTGRES_DOCKER_IMAGE=postgres:17 \
            GELATO_LOCAL_DUMMY_RASTERS="$RUNNER_TEMP/gelato-combined-rasters" \
            GELATO_LOCAL_NATIVE_QUEUE=1 GELATO_LOCAL_PERSISTENT_JOURNEY=1 GELATO_LOCAL_ISOLATION_SCHEMA=1 \
            GELATO_LOCAL_JOURNEY_OUTPUT="$RUNNER_TEMP/gelato-combined-private.json" \
            node --import tsx scripts/test-gelato-local-journey.ts
      - name: Verify retained historical combined evidence without asserting current source parity
        run: python3 docs/repo-workflows-planning/gelato-combined-evidence-2026-10-19/verify.py
      - name: Verify retained historical isolation evidence
        run: python3 docs/repo-workflows-planning/gelato-isolation-evidence-2026-10-19/verify.py
      - name: Verify retained isolated-runner evidence without renewing historical live receipts
        run: python3 docs/repo-workflows-planning/gelato-isolated-runner-evidence-2026-10-20/verify.py
      - name: Verify protected transport and actual OS crash recovery locally
        working-directory: back-end
        run: env -i HOME="$HOME" PATH="$PATH" npm run test:gelato-protected-runner
      - name: Verify protected-runner evidence and current source bindings
        run: |
          python3 docs/repo-workflows-planning/gelato-protected-runner-evidence-2026-10-20/verify.py
          python3 docs/repo-workflows-planning/gelato-incident-safeguards-evidence-2026-10-21/verify.py
          python3 docs/repo-workflows-planning/gelato-draft-approval-evidence-2026-10-22/verify.py
          python3 docs/repo-workflows-planning/gelato-auth-attestation-evidence-2026-10-22/verify.py
          python3 docs/repo-workflows-planning/controlled-pipeline-source-evidence-2026-10-22/verify.py
          python3 docs/repo-workflows-planning/controlled-character-handoff-evidence-2026-10-22/verify.py
          python3 docs/repo-workflows-planning/lhl-diagnostic-access-evidence-2026-10-23/verify.py
          python3 docs/repo-workflows-planning/gelato-admission-settlement-evidence-2026-10-23/verify.py --source
          python3 docs/repo-workflows-planning/gelato-admission-settlement-evidence-2026-10-23/test-verifier.py
