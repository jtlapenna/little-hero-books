name: Check Workflow Export Secrets

on:
  pull_request:
    paths:
      - "docs/n8n-workflow-files/**"
      - "back-end/scripts/check-workflow-export-secrets.ts"
      - "back-end/scripts/test-workflow-export-secrets.ts"
      - "back-end/scripts/test-gelato-workflow-copies.ts"
      - "back-end/scripts/test-gelato-submission-runtime.ts"
      - "back-end/scripts/test-gelato-runtime-file-fetch.ts"
      - "back-end/scripts/test-gelato-stored-file-worker.ts"
      - "back-end/scripts/prepare-gelato-runtime-bindings.mjs"
      - "back-end/scripts/test-gelato-runtime-bindings.mjs"
      - "back-end/wrangler.toml"
      - ".github/workflows/deploy-cloudflare-pages.yml"
      - "back-end/scripts/test-gelato-notifications.ts"
      - "back-end/scripts/test-gelato-print-submissions.sh"
      - "back-end/scripts/test-gelato-print-submissions.sql"
      - "database/migration-print-provider-fields.sql"
      - "database/migration-gelato-engineering-notification-suppression.sql"
      - "database/migration-gelato-scoped-engineering-windows.sql"
      - "back-end/scripts/check-gelato-scoped-migration.mjs"
      - "back-end/scripts/test-gelato-submission.ts"
      - "back-end/src/lib/books/**"
      - "back-end/src/app/api/internal/w4/submit-gelato-draft/route.ts"
      - "back-end/src/lib/w0-manifest-builder.ts"
      - "back-end/src/lib/order-paths.ts"
      - "back-end/src/lib/r2-client.ts"
      - "back-end/src/lib/workflow-export-secrets.ts"
      - "back-end/package.json"
      - "back-end/package-lock.json"
      - ".github/workflows/check-workflow-export-secrets.yml"
  push:
    branches:
      - main
    paths:
      - "docs/n8n-workflow-files/**"
      - "back-end/scripts/check-workflow-export-secrets.ts"
      - "back-end/scripts/test-workflow-export-secrets.ts"
      - "back-end/scripts/test-gelato-workflow-copies.ts"
      - "back-end/scripts/test-gelato-submission-runtime.ts"
      - "back-end/scripts/test-gelato-runtime-file-fetch.ts"
      - "back-end/scripts/test-gelato-stored-file-worker.ts"
      - "back-end/scripts/prepare-gelato-runtime-bindings.mjs"
      - "back-end/scripts/test-gelato-runtime-bindings.mjs"
      - "back-end/wrangler.toml"
      - ".github/workflows/deploy-cloudflare-pages.yml"
      - "back-end/scripts/test-gelato-notifications.ts"
      - "back-end/scripts/test-gelato-print-submissions.sh"
      - "back-end/scripts/test-gelato-print-submissions.sql"
      - "database/migration-print-provider-fields.sql"
      - "database/migration-gelato-engineering-notification-suppression.sql"
      - "database/migration-gelato-scoped-engineering-windows.sql"
      - "back-end/scripts/check-gelato-scoped-migration.mjs"
      - "back-end/scripts/test-gelato-submission.ts"
      - "back-end/src/lib/books/**"
      - "back-end/src/app/api/internal/w4/submit-gelato-draft/route.ts"
      - "back-end/src/lib/w0-manifest-builder.ts"
      - "back-end/src/lib/order-paths.ts"
      - "back-end/src/lib/r2-client.ts"
      - "back-end/src/lib/workflow-export-secrets.ts"
      - "back-end/package.json"
      - "back-end/package-lock.json"
      - ".github/workflows/check-workflow-export-secrets.yml"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: back-end/package-lock.json

      - name: Install back-end dependencies
        working-directory: back-end
        run: npm ci

      - name: Run scanner unit tests
        working-directory: back-end
        run: npm run test:workflow-export-secrets

      - name: Check Gelato workflow contracts
        working-directory: back-end
        run: npm run test:gelato-workflow-copies

      - name: Check Gelato submission runtime
        working-directory: back-end
        run: npm run test:gelato-submission-runtime

      - name: Check Gelato runtime binding preparation
        working-directory: back-end
        run: npm run test:gelato-runtime-bindings

      - name: Check persisted Gelato quote and draft requests
        working-directory: back-end
        run: npm run test:gelato-submission

      - name: Verify Gelato file fetches in runtime and Worker engine
        working-directory: back-end
        run: npm run test:gelato-worker-files

      - name: Resolve diff range
        id: range
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git rev-parse HEAD^)"
          fi

          echo "base=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Scan changed workflow exports
        working-directory: back-end
        run: >
          npm run check:workflow-export-secrets --
          --diff-base "${{ steps.range.outputs.base }}"
          --diff-head "${{ steps.range.outputs.head }}"

  gelato-notification-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: back-end/package-lock.json
      - name: Install locked dependencies
        working-directory: back-end
        run: npm ci
      - name: Verify synthetic suppression and ordinary notification retries
        working-directory: back-end
        run: npm run test:gelato-notifications
      - name: Install disposable PostgreSQL test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql ripgrep
      - name: Verify migration, authorization, quarantine and concurrency
        working-directory: back-end
        run: |
          GELATO_TEST_PG_BIN="$(pg_config --bindir)" npm run test:gelato-print-submissions
