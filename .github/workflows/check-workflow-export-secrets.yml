name: Check Workflow Export Secrets

on:
  pull_request:
    paths:
      - "docs/n8n-workflow-files/**"
      - "back-end/scripts/check-workflow-export-secrets.ts"
      - "back-end/scripts/test-workflow-export-secrets.ts"
      - "back-end/src/lib/workflow-export-secrets.ts"
      - "back-end/package.json"
      - "back-end/package-lock.json"
      - ".github/workflows/check-workflow-export-secrets.yml"
  push:
    branches:
      - main
    paths:
      - "docs/n8n-workflow-files/**"
      - "back-end/scripts/check-workflow-export-secrets.ts"
      - "back-end/scripts/test-workflow-export-secrets.ts"
      - "back-end/src/lib/workflow-export-secrets.ts"
      - "back-end/package.json"
      - "back-end/package-lock.json"
      - ".github/workflows/check-workflow-export-secrets.yml"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: back-end/package-lock.json

      - name: Install back-end dependencies
        working-directory: back-end
        run: npm ci

      - name: Run scanner unit tests
        working-directory: back-end
        run: npm run test:workflow-export-secrets

      - name: Resolve diff range
        id: range
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git rev-parse HEAD^)"
          fi

          echo "base=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Scan changed workflow exports
        working-directory: back-end
        run: >
          npm run check:workflow-export-secrets --
          --diff-base "${{ steps.range.outputs.base }}"
          --diff-head "${{ steps.range.outputs.head }}"
