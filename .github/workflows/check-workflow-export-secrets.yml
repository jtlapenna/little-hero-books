name: Check Workflow Export Secrets

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - "back-end/**"
      - "database/**"
      - "scripts/security/**"
      - "docs/database/fix-supabase-admin-permissions.sql"
      - "docs/n8n-workflow-files/**"
      - ".github/workflows/deploy-cloudflare-pages.yml"
      - ".github/workflows/check-workflow-export-secrets.yml"
  push:
    branches: [main]
    paths:
      - "back-end/**"
      - "database/**"
      - "scripts/security/**"
      - "docs/database/fix-supabase-admin-permissions.sql"
      - "docs/n8n-workflow-files/**"
      - ".github/workflows/deploy-cloudflare-pages.yml"
      - ".github/workflows/check-workflow-export-secrets.yml"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: back-end/package-lock.json

      - name: Install back-end dependencies
        working-directory: back-end
        run: npm ci

      - name: Run scanner unit tests
        working-directory: back-end
        run: npm run test:workflow-export-secrets

      - name: Check Gelato workflow contracts
        working-directory: back-end
        run: npm run test:gelato-workflow-copies

      - name: Check Gelato submission runtime
        working-directory: back-end
        run: npm run test:gelato-submission-runtime

      - name: Check Gelato runtime binding preparation
        working-directory: back-end
        run: npm run test:gelato-runtime-bindings

      - name: Check persisted Gelato quote and draft requests
        working-directory: back-end
        run: npm run test:gelato-submission

      - name: Verify read-only intake and canonical Worker publication
        working-directory: back-end
        run: npm run test:w0-publication

      - name: Verify lifecycle reconciliation and unchanged-time conversion
        working-directory: back-end
        run: npm run test:gelato-lifecycle

      - name: Verify one-time unpaid conversion ownership and ambiguity
        working-directory: back-end
        run: npm run test:gelato-engineering-conversion

      - name: Verify isolated queued fulfillment and scoped status execution
        working-directory: back-end
        run: npm run test:gelato-engineering-automation

      - name: Verify provider webhook and isolated status scheduler
        working-directory: back-end
        run: npm run test:gelato-webhook-status

      - name: Verify shared poller file deadline
        working-directory: back-end
        run: node --import tsx scripts/test-gelato-poll-stored-file.ts

      - name: Verify conversion transport in the production-config Worker
        working-directory: back-end
        run: npm run test:gelato-engineering-conversion-worker

      - name: Verify Gelato file fetches in runtime and Worker engine
        working-directory: back-end
        run: npm run test:gelato-worker-files

      - name: Verify provider API and status consumers
        working-directory: back-end
        run: |
          npm run test:gelato-api-contract
          npm run test:gelato-consumer-contract
          npm run test:gelato-consumer-api
          npm run test:gelato-attention-recovery-api
          npm run test:approval-gelato-status-consumer
          npm run test:preview-book-contract

      - name: Verify legacy callback provider ownership and persisted completion
        working-directory: back-end
        run: |
          npm run test:w4-print-submitted
          npm run test:print-submitted-provider-boundary
          npm run test:lulu-status-map

      - name: Verify registered scheduler, financial observations and admin display
        working-directory: back-end
        run: |
          npm run test:gelato-scheduled-status
          npm run test:gelato-financial-observation
          npm run test:gelato-admin-inspection

      - name: Resolve diff range
        id: range
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git rev-parse HEAD^)"
          fi

          echo "base=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Scan all workflow exports
        working-directory: back-end
        run: npm run check:workflow-export-secrets -- --all

  gelato-notification-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: back-end/package-lock.json
      - name: Install locked dependencies
        working-directory: back-end
        run: npm ci
      - name: Verify synthetic suppression and ordinary notification retries
        working-directory: back-end
        run: npm run test:gelato-notifications
      - name: Install disposable PostgreSQL test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql ripgrep
      - name: Verify private order table and manifest RPC boundaries
        working-directory: back-end
        run: LHL_TEST_PG_BIN="$(pg_config --bindir)" node --import tsx ../scripts/security/test-private-order-boundaries.mts
      - name: Verify migration, authorization, quarantine and concurrency
        working-directory: back-end
        run: |
          GELATO_TEST_PG_BIN="$(pg_config --bindir)" npm run test:gelato-print-submissions
